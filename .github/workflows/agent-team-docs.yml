name: Agent-team documentation integrity

on:
  pull_request:
    paths:
      - "docs/agent-team/**"
      - "scripts/agent-team/**"
      - ".github/workflows/agent-team-docs.yml"
  push:
    branches:
      - master
    paths:
      - "docs/agent-team/**"
      - "scripts/agent-team/**"
      - ".github/workflows/agent-team-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test discussion generator
        run: python3 -m unittest discover -s scripts/agent-team -p "test_*.py"
      - name: Verify generated discussion bundles
        run: python3 scripts/agent-team/build_discussions.py --check
      - name: Build explicitly public presentation site
        run: python3 scripts/agent-team/build_preview_site.py
      - name: Verify TASK-0001 export
        run: test -s dist/agent-team-previews/TASK-0001/index.html
      - name: Upload portable presentation site
        uses: actions/upload-artifact@v4
        with:
          name: agent-team-presentation-site
          path: dist/agent-team-previews/
          if-no-files-found: error
