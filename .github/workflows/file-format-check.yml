name: File format v1 check

on:
  pull_request:
    paths:
      - "docs/baseline/schemas/**"
      - "docs/baseline/examples/**"
      - "tools/format-check/**"
      - ".github/workflows/file-format-check.yml"
  push:
    branches:
      - master
    paths:
      - "docs/baseline/schemas/**"
      - "docs/baseline/examples/**"
      - "tools/format-check/**"
      - ".github/workflows/file-format-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: python3 -m pip install "jsonschema>=4.18"
      - name: Schema, example replay and negative cases
        run: python3 tools/format-check/check_format.py
