query ListEntriesByUser($uid: String!) @auth(level: USER) {
  entries(where: { uid: { eq: $uid } }, orderBy: [{ entryDateStart: DESC }, { createdAt: DESC }]) {
    id
    uid
    title
    body
    entryDateStart
    entryDateEnd
    eventStartAt
    eventEndAt
    originType
    source
    status
    currentRevisionId
    createdAt
    updatedAt
  }
}

query GetEntryById($id: String!) @auth(level: USER) {
  entry(id: $id) {
    id
    uid
    title
    body
    entryDateStart
    entryDateEnd
    eventStartAt
    eventEndAt
    originType
    source
    status
    currentRevisionId
    createdAt
    updatedAt
  }
}
